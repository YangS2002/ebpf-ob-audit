user:
  # SSH 登录用户。部署脚本通过该用户把 collector 包复制到 collector 节点。
  username: yangshuo17
  # SSH 端口。
  port: 32200
  # SSH 密码；如果已配置免密登录，可以留空。
  password: ""

collector:
  global:
    # collector 部署目录。
    deploy_home: /home/yangshuo17/ebpf-ob-audit-collector

    # collector 运行时配置。部署脚本会把本段和实例 override 合并成远端 conf/collector-<port>.yaml。
    runtime:
      collector:
        registry:
          # 是否把 collector 实例注册到 etcd，供 agent 服务发现。
          enabled: true
          etcd_endpoints: http://7.27.43.145:2379
          service_name: audit-collector
          lease_ttl_sec: 10
          keepalive_interval_sec: 3
      storage:
        # 当前 collector 存储后端。
        type: mongodb
      mongodb:
        uri: mongodb://audit_collector:1@7.27.43.145:27017/ob_audit?authSource=ob_audit
        database: ob_audit
        collection: audit_events
        # 丢失/对账可观测指标集合，agent 通过 gRPC 上报，collector 自身周期写入。
        metrics_collection: audit_pipeline_metrics
        # 审计事件保留 3 天。
        event_ttl_days: 3
        # 丢失/对账指标暂保留 1 天。
        metrics_ttl_days: 1
        # 存放 schema 版本字典的集合（_id=version），下游按记录 sv 拉取解码。
        schema_collection: audit_schemas
        # 字段编码 schema 文件（JSON：{version, fields:{数字键: 全名}}）。
        # 启动时加载、校验并写入 schema_collection；每条记录带 sv 版本标记。
        schema_file_path: audit_schema.json
        app_name: ebpf-ob-audit-collector
        write_concern: w1
        # 写关注确认超时（毫秒）；副本集迟迟不确认时按此超时失败，避免 worker 无限阻塞。
        write_concern_wtimeout_ms: 2000
        connect_timeout_ms: 2000
        server_selection_timeout_ms: 3000
        # 启动时对非空集合建唯一索引需扫全表, 压测期负载高时 >5s 会超时报
        # "createIndexes ... Failed to read 4 bytes", 故放宽到 30s。
        socket_timeout_ms: 30000
        pool_min_size: 1
        pool_max_size: 4
        insert_concurrency: 4
        bulk_max_records: 1000
        bulk_max_bytes: 4194304
        ordered_insert: false

  # collector 实例列表。节点级字段只覆盖 collector 自己的监听、注册、存储配置。
  # 不要在这里放 agent uprobe offset、pending buffer、grpc queue 等配置。
  servers:
    - name: collector-50051
      ip: 7.27.43.145
      listen_port: 50051
      instance_id: collector-50051
    - name: collector-50052
      ip: 7.27.43.145
      listen_port: 50052
      instance_id: collector-50052
    # - name: collector-50053
    #   ip: 7.27.43.139
    #   listen_port: 50053
    #   instance_id: collector-50053
      # 示例：只给该实例覆盖 Mongo bulk 大小。
      # override:
      #   mongodb:
      #     bulk_max_records: 2000
