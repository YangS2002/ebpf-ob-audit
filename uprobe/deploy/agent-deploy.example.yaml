user:
  # SSH 登录用户。部署脚本通过该用户把 agent 包复制到 OB 节点。
  username: yangshuo17
  # SSH 端口。
  port: 32200
  # SSH 密码；如果已配置免密登录，可以留空。
  password: ""
  # 远端 sudo 密码，用于以 root 权限启动 uprobe。
  sudo_password: "1"

oceanbase-ce:
  # OB 集群基础信息。agent 节点默认来自这里，agent 自身配置不包含 collector/Mongo 设置。
  global:
    home_path: /home/yangshuo17/ob3node
  servers:
    - name: ob1
      ip: 7.27.43.145
    - name: ob2
      ip: 7.27.43.136
    - name: ob3
      ip: 7.27.43.137

agent:
  global:
    # agent 部署目录。
    deploy_home: /home/yangshuo17/ebpf-ob-audit-agent

    # agent 运行时配置。部署脚本会把本段和节点 override 合并成远端 conf/agent.yaml。
    runtime:
      collector:
        # collector 静态地址；关闭 discovery 或 discovery 暂无结果时可直接使用。
        addr: 7.27.43.138:50051
        discovery:
          enabled: true
          etcd_endpoints: http://7.27.43.139:2379
          service_name: audit-collector
          selection_policy: hash_agent
      buffer:
        # agent 用户态分片 SQL/params 重组缓冲池，不包含 eBPF ringbuf。
        pending_ringbuf_bytes: 16777216
      grpc:
        # 单批 Upload 最大字节数。
        batch_bytes: 262144
        # 批次聚合等待时间，毫秒。
        flush_interval_ms: 1000
        # 单次 Upload RPC 超时，毫秒。
        timeout_ms: 2000
        # agent 用户态发送批次内存池大小；内存池耗尽时丢新记录，不阻塞 BPF 消费线程。
        pool_bytes: 67108864
        # 并发上传 worker 数，上界由 agent 限制。
        upload_concurrency: 2
        # 单批失败后最多重试次数；总尝试次数 = 1 + max_retries。
        max_retries: 3
        # 失败恢复退避配置。
        retry_initial_ms: 100
        retry_max_ms: 500
      uprobe:
        # observer_path 为空时，部署脚本可由 oceanbase-ce.global.home_path 推导。
        observer_path: /home/yangshuo17/ob3node/bin/observer
        offset: "0x000000000bf18950"
        output_file: out.adt

  # 节点级配置只覆盖 agent 自己的运行参数；不要放 collector 监听、注册、Mongo 配置。
  ob1:
    override:
      agent:
        id: agent-ob1-7.27.43.145
  ob2:
    override:
      agent:
        id: agent-ob2-7.27.43.136
  ob3:
    override:
      agent:
        id: agent-ob3-7.27.43.137
      # 示例：只给 ob3 调大发送内存池。
      # grpc:
      #   pool_bytes: 134217728
